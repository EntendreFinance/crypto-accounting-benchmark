[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-accounting-bench"
version = "0.1.0"
description = "Educational, reproducible runner for Crypto Accounting Bench"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "huggingface-hub>=0.34",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["openai>=1.0"]

[project.scripts]
cab = "cab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".pytest-tmp"]
